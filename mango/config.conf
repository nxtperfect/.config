# More option see https://github.com/DreamMaoMao/mango/wiki/

# Window effect
blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 8
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadowscolor= 0x000000ff

border_radius=0
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=0.90

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=0
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=200
animation_duration_open=200
animation_duration_tag=200
animation_duration_close=200
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.5
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=0
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.25,0.5,1.0

# Master-Stack Layout Setting
new_is_master=1
default_mfact=0.55
default_nmaster=1
tag_num=9
smartgaps=20

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=0

# Overview Setting
hotarea_size=10
enable_hotarea=0
ov_tab_mode=1
overviewgappi=5
overviewgappo=30

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=0
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=28
cursor_theme=retrosmart-xcursor-black
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=25
repeat_delay=200
numlockon=0
xkb_rules_layout=pl

# Trackpad
# need relogin to make it apply
disable_trackpad=1
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Appearance
gappih=12
gappiv=12
gappoh=48
gappov=26
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=2
rootcolor=0x201b1400
bordercolor=0x50505000
dropcolor=0x8FBA7C55
splitcolor=0xEB441EFF
focuscolor=0xE0B6BFff
maximizescreencolor=0x89aa61ff
urgentcolor=0xad401fff
scratchpadcolor=0x516c93ff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tagrule=id:1,layout_name:scroller
tagrule=id:2,layout_name:scroller
tagrule=id:3,layout_name:center_tile
tagrule=id:4,layout_name:scroller
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER,r,reload_config

# menu and terminal
bind=Super,d,spawn,vicinae toggle
bind=Super,Return,spawn,footclient
bind=Super,space,spawn,footclient yazi

# microphone
bind=Super,m,spawn,pamixer --default-source -t

# screenshot
bind=none,Print,spawn_shell,wayfreeze & PID=$!; sleep .1; g=$(slurp -d) && [ -n "$g" ] && grim -g "$g" - | wl-copy; kill $PID
bind=Shift,Print,spawn_shell,wayfreeze & PID=$!; sleep .1; g=$(slurp -d) && [ -n "$g" ] && mkdir -p ~/Pictures/Screenshots && f=~/Pictures/Screenshots/"Screenshot from $(date '+%Y-%m-%d %H-%M-%S').png" && grim -g "$g" "$f" && wl-copy < "$f"; kill $PID

# exit
bind=SUPER+shift+alt,q,quit
bind=Super,q,killclient,

# switch window focus
bind=SUPER,Tab,focusstack,next
bind=Super,h,focusdir,left
bind=Super,l,focusdir,right
bind=Super,k,focusdir,up
bind=Super,j,focusdir,down

# swap window
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right

# switch window status
bind=SUPER,g,toggleglobal,
bind=ALT,Tab,togglejump,
bind=Super,v,togglefloating,
bind=Super,a,togglemaximizescreen,
bind=Super,f,togglefullscreen,
bind=Super+SHIFT,f,togglefakefullscreen,
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
bind=ALT,z,toggle_scratchpad

# scroller layout
bind=Super,e,set_proportion,1.0
bind=Super,x,switch_proportion_preset,
bind=alt+super+ctrl,h,scroller_stack,left
bind=alt+super+ctrl,l,scroller_stack,right
bind=alt+super+ctrl,k,scroller_stack,up
bind=alt+super+ctrl,j,scroller_stack,down

#dwindle layout(manual split mode)
bind=alt+shift,Return,dwindle_toggle_split_direction

# switch layout
bind=SUPER,n,switch_layout

# tag switch
#bind=SUPER,Left,viewtoleft,0
#bind=Super+ctrl,Left,viewtoleft_have_client,0
#bind=SUPER,Right,viewtoright,0
#bind=Super+ctrl,Right,viewtoright_have_client,0
#bind=CTRL+SUPER,Left,tagtoleft,0
#bind=CTRL+SUPER,Right,tagtoright,0

bind=Super,1,view,1,0
bind=Super,2,view,2,0
bind=Super,3,view,3,0
bind=Super,4,view,4,0
bind=Super,5,view,5,0
bind=Super,6,view,6,0
bind=Super,7,view,7,0
bind=Super,8,view,8,0
bind=Super,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=Super+shift,1,tag,1,0
bind=Super+shift,2,tag,2,0
bind=Super+shift,3,tag,3,0
bind=Super+shift,4,tag,4,0
bind=Super+shift,5,tag,5,0
bind=Super+shift,6,tag,6,0
bind=Super+shift,7,tag,7,0
bind=Super+shift,8,tag,8,0
bind=Super+shift,9,tag,9,0

# monitor switch
#bind=alt+shift,Left,focusmon,left
#bind=alt+shift,Right,focusmon,right
#bind=SUPER+Alt,Left,tagmon,left
#bind=SUPER+Alt,Right,tagmon,right

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# movewin
bind=Super+SHIFT,Up,movewin,+0,-50
bind=Super+SHIFT,Down,movewin,+0,+50
bind=Super+SHIFT,Left,movewin,-50,+0
bind=Super+SHIFT,Right,movewin,+50,+0

# resizewin
bind=Super+ALT,k,resizewin,+0,-50
bind=Super+ALT,j,resizewin,+0,+50
bind=Super+ALT,h,resizewin,-50,+0
bind=Super+ALT,l,resizewin,+50,+0

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=Super,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize

# Axis Bindings
#axisbind=SUPER,UP,viewtoleft_have_client
#axisbind=SUPER,DOWN,viewtoright_have_client

# Windowrule
windowrule=allow_csd:0,appid:*
windowrule=noblur:1,appid:slurp
windowrule=noblur:1,appid:Mullvad VPN
windowrule=scroller_proportion:1,appid:librewolf
windowrule=scroller_proportion:1,appid:mpv
windowrule=scroller_proportion:1,appid:net.lutris.Lutris

# layer rule
layerrule=animation_type_open:zoom,layer_name:vicinae
layerrule=animation_type_close:zoom,layer_name:vicinae
layerrule=noanim:1,noblur:1,layer_name:selection

# autorun
exec-once=/usr/libexec/polkit-mate-authentication-agent-1
exec-once=xwayland-satellite
exec-once=qs
exec-once=librewolf
exec-once=foot --server
exec-once=awww-daemon
exec-once=mullvad-vpn
exec-once=kmonad ~/.config/kmonad/config.kbd
exec-once=mpd ~/.config/mpd/mpd.conf
exec-once=vicinae server
exec-once=gentoo-pipewire-launcher
exec-once=mullvad-exclude vesktop-bin
exec-once=footclient
exec-once=footclient
exec-once=footclient
exec-once=signal-desktop
exec-once=keepassxc
exec-once=flatpak run app.grayjay.Grayjay
exec-once=gammastep -c ~/.config/gammastep/config.ini
exec-once=flatpak run com.github.wwmm.easyeffects
exec-once=nicotine
exec-once=transmission-qt
exec-once=flatpak run com.valvesoftware.Steam
exec-once=lutris
