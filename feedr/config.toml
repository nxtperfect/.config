# Feedr Configuration File
# This file is automatically generated with default values.
# You can modify any settings below to customize Feedr's behavior.
#
# For more information, visit: https://github.com/bahdotsh/feedr

default_feeds = []

[general]
max_dashboard_items = 100
auto_refresh_interval = 0
refresh_enabled = false
refresh_rate_limit_delay = 2000

[network]
http_timeout = 15
user_agent = "Mozilla/5.0 (compatible; Feedr/1.0; +https://github.com/bahdotsh/feedr)"

[ui]
tick_rate = 100
error_display_timeout = 3000
theme = "light"
compact_mode = "auto"


# Background Refresh Settings:
# - refresh_enabled: Enable automatic background refresh (default: false)
# - auto_refresh_interval: Time in seconds between auto-refreshes (default: 0/disabled)
# - refresh_rate_limit_delay: Delay in milliseconds between requests to same domain (default: 2000ms)
#   This prevents "too many requests" errors, especially for Reddit feeds
#
# UI Theme Settings:
# - theme: Choose between "light" or "dark" theme (default: dark)
#   You can also toggle the theme in the app by pressing 't'
#
# Example configuration for auto-refresh every 5 minutes:
# [general]
# refresh_enabled = true
# auto_refresh_interval = 300
# refresh_rate_limit_delay = 2000
#
# [ui]
# theme = "light"
# compact_mode = "auto"  # auto (default), always, or never
#
# Example default feeds configuration:
# [[default_feeds]]
# url = "https://example.com/feed.xml"
# category = "News"
#
# [[default_feeds]]
# url = "https://another-example.com/rss"
# category = "Tech"
#
# Authenticated feed example (custom HTTP headers):
# [[default_feeds]]
# url = "https://private.example.com/feed.xml"
# [default_feeds.headers]
# Authorization = "Bearer your_token_here"
